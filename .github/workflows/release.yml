# Builds wheels, tests them, publishes to PyPI with trusted publishing, and
# attaches the Windows executables to the GitHub release. See PUBLISHING.md.
name: Release

on:
  release:
    types: [published]
  workflow_dispatch: # build and test without publishing

permissions:
  contents: read

jobs:
  wheels:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: windows-latest, target: x64 }
          - { os: macos-latest, target: aarch64 }
          - { os: macos-13, target: x86_64 }
          - { os: ubuntu-latest, target: x86_64 }
          - { os: ubuntu-latest, target: aarch64 }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: PyO3/maturin-action@v1
        with:
          target: ${{ matrix.target }}
          args: --release --out dist
          manylinux: auto
      - name: Test the wheel
        # Cross-compiled aarch64 Linux wheels cannot run on the x86_64 runner.
        if: matrix.target != 'aarch64' || runner.os != 'Linux'
        shell: bash
        run: |
          python -m pip install pytest hypothesis
          python -m pip install --no-index --find-links dist graphydra
          python -m pytest tests/python -q -p no:cacheprovider
      - uses: actions/upload-artifact@v4
        with:
          name: wheels-${{ matrix.os }}-${{ matrix.target }}
          path: dist

  sdist:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: PyO3/maturin-action@v1
        with:
          command: sdist
          args: --out dist
      - uses: actions/upload-artifact@v4
        with:
          name: sdist
          path: dist

  publish-pypi:
    if: github.event_name == 'release'
    needs: [wheels, sdist]
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write # trusted publishing; no API token is stored
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - uses: pypa/gh-action-pypi-publish@release/v1

  executables:
    runs-on: windows-latest
    permissions:
      contents: write # attach files to the release
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --release -p graphydra-studio -p graphydra-cli
      - run: cargo build --release -p graphydra-studio -p graphydra-cli
      - name: Package
        shell: pwsh
        run: |
          $v = "${{ github.event.release.tag_name || 'dev' }}"
          Compress-Archive -Path target/release/graphydra-studio.exe, target/release/graphydra.exe, README.md `
            -DestinationPath "graphydra-$v-windows-x64.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: windows-executables
          path: graphydra-*-windows-x64.zip
      - if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ github.event.release.tag_name }}" graphydra-*-windows-x64.zip
