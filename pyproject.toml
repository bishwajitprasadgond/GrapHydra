[build-system]
requires = ["maturin>=1.7,<2"]
build-backend = "maturin"

[project]
name = "graphydra"
description = "Embedded, local-first graph database with a declarative query language and crash-safe .graph files"
# The PyPI page; the repository README links images PyPI cannot show.
readme = "python/README.md"
requires-python = ">=3.9"
license = { text = "MIT OR Apache-2.0" }
keywords = ["graph", "database", "embedded", "query-language", "knowledge-graph"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: MacOS",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Rust",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: Implementation :: CPython",
    "Topic :: Database :: Database Engines/Servers",
    "Typing :: Typed",
]
dynamic = ["version"]
authors = [{ name = "Bishwajit Prasad Gond", email = "bishwajitprasadgond@gmail.com" }]

[project.urls]
Homepage = "https://github.com/bishwajitprasadgond/GrapHydra"
Source = "https://github.com/bishwajitprasadgond/GrapHydra"
Documentation = "https://github.com/bishwajitprasadgond/GrapHydra#readme"
Issues = "https://github.com/bishwajitprasadgond/GrapHydra/issues"

[project.optional-dependencies]
test = ["pytest>=8", "hypothesis>=6"]

[tool.maturin]
manifest-path = "crates/graphydra-py/Cargo.toml"
python-source = "python"
module-name = "graphydra._graphydra"
features = ["pyo3/extension-module"]
strip = true

[tool.pytest.ini_options]
testpaths = ["tests/python"]

[tool.ruff]
line-length = 110
target-version = "py39"

[tool.pyright]
include = ["python", "tests/python"]
typeCheckingMode = "strict"
