[package]
name = "graphydra-cli"
description = "Command-line tool for GrapHydra .graph files"
version.workspace = true
authors.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[[bin]]
name = "graphydra"
path = "src/main.rs"

[dependencies]
graphydra-core = { path = "../graphydra-core" }
clap = { version = "4.6.7", features = ["derive"] }
serde_json = "1.0.154"
serde = "1.0.229"

[dev-dependencies]
tempfile = "3.27.0"

[lints]
workspace = true
