[workspace]
resolver = "3"
members = ["crates/graphydra-core", "crates/graphydra-cli", "crates/graphydra-py", "crates/graphydra-studio"]

[workspace.package]
version = "0.1.0"
authors = ["Bishwajit Prasad Gond <bishwajitprasadgond@gmail.com>"]
edition = "2024"
rust-version = "1.89"
license = "MIT OR Apache-2.0"
repository = "https://github.com/bishwajitprasadgond/GrapHydra"

[workspace.lints.rust]
unsafe_code = "deny"

[workspace.lints.clippy]
dbg_macro = "warn"
todo = "warn"
unwrap_used = "warn"
type_complexity = "allow"

[profile.dev]
# Line tables keep backtraces useful while cutting build size several-fold.
debug = "line-tables-only"

[profile.release]
lto = "thin"
codegen-units = 1
